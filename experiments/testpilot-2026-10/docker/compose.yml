services:
  tp:
    build:
      context: .
      dockerfile: Dockerfile
    image: testpilot-ss:latest
    working_dir: /work
    volumes:
      - ../../..:/work/ss
      - ../../../../testpilot2:/work/testpilot2
      - ../../../../ss-commits:/work/ss-commits
      - ../../../../ss-commits/.cache/yarn:/root/.cache/yarn
      - ../../../../ss-commits/.cache/pnpm:/root/.local/share/pnpm
    tty: true
    stdin_open: true
